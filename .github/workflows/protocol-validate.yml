name: "Validate Protocol Evidence"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-protocol:
    name: Validate protocol evidence in changed docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Make script executable
        run: chmod +x .github/scripts/validate_protocol.py

      - id: validate
        name: Run protocol validator and capture output
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .github/scripts/validate_protocol.py > validator.out || true
          rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat validator.out || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment on failure
        if: ${{ steps.validate.outputs.rc != '0' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Protocol validation failed**

            The protocol validator detected missing evidence sections in one or more changed files. Please add an `Evidências` section containing commit IDs, issue links and sprint reference, or mark the change as non-functional in the PR description.

            ---

            ${{ steps.validate.outputs.body }}

      - name: Fail job if validation failed
        if: ${{ steps.validate.outputs.rc != '0' }}
        run: |
          echo "Protocol validation failed, failing job."
          exit 1
