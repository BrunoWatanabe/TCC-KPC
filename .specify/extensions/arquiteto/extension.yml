schema_version: "1.0"

extension:
  id: arquiteto
  name: "Agente Arquiteto"
  version: "1.0.0"
  description: "Agente de modelagem arquitetural e refinamento da especificação antes da fase principal do Spec Kit"
  author: Daired
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.8.10"
  commands:
    - speckit.specify

provides:
  commands:
    - name: speckit.arquiteto.specify
      file: commands/speckit.arquiteto.specify.md
      description: "Executar a etapa arquitetural antes da especificação formal"

hooks:
  before_specify:
    command: speckit.arquiteto.specify
    optional: false
    description: "Executar o Agente Arquiteto antes da geração da especificação"

tags:
  - architecture
  - specification
  - model
