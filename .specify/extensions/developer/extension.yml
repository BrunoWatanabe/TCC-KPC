schema_version: "1.0"

extension:
  id: developer
  name: "Agente Developer"
  version: "1.0.0"
  description: "Agente de geração e refinamento de código frontend a partir da especificação e do plano do Spec Kit"
  author: Daired
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.8.10"
  commands:
    - speckit.tasks
    - speckit.implement

provides:
  commands:
    - name: speckit.developer.implement
      file: commands/speckit.developer.implement.md
      description: "Executar a etapa de desenvolvimento antes da implementação formal"

hooks:
  before_implement:
    command: speckit.developer.implement
    optional: false
    description: "Executar o Agente Developer antes da implementação formal"

tags:
  - development
  - implementation
  - frontend
