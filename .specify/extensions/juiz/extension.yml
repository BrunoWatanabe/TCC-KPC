schema_version: "1.0"

extension:
  id: juiz
  name: "Agente Juiz"
  version: "1.0.0"
  description: "Agente de análise e decisão sobre inconsistências entre modelo e código após a implementação"
  author: Daired
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.8.10"
  commands:
    - speckit.implement

provides:
  commands:
    - name: speckit.juiz.inconsistencia
      file: commands/speckit.juiz.inconsistencia.md
      description: "Executar a etapa de julgamento de inconsistências após a implementação"

hooks:
  after_implement:
    command: speckit.juiz.inconsistencia
    optional: false
    description: "Executar o Agente Juiz após a implementação formal"

tags:
  - review
  - decision
  - inconsistency
