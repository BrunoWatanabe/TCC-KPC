schema_version: "1.0"

extension:
  id: policia
  name: "Agente Polícia"
  version: "1.0.0"
  description: "Agente de coleta de evidências e identificação de inconsistências entre modelo e código após a implementação"
  author: Daired
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.8.10"
  commands:
    - speckit.implement

provides:
  commands:
    - name: speckit.policia.inconsistencia
      file: commands/speckit.policia.inconsistencia.md
      description: "Executar a etapa de coleta de evidências de inconsistência após a implementação"

hooks:
  after_implement:
    command: speckit.policia.inconsistencia
    optional: false
    description: "Executar o Agente Polícia antes do julgamento"

tags:
  - evidence
  - analysis
  - inconsistency
